name: pre-commit

on:
  pull_request:
    branches:
      - main
      - "16.0*"
      - "17.0*"
      - "18.0*"
  push:
    branches:
      - main
      - "16.0*"
      - "17.0*"
      - "18.0*"

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared renderer
        uses: actions/checkout@v4
        with:
          repository: bitwise-hq/bitwise-hq
          ref: main
          path: bitwise-hq
          fetch-depth: 1
          sparse-checkout: |
            scripts/odoo_addon_description_renderer.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ secrets.BITWISE_ORG_GH_PAT || secrets.GIT_PUSH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Get python version
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        env:
          BITWISE_HQ_ROOT: ${{ github.workspace }}/bitwise-hq
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi